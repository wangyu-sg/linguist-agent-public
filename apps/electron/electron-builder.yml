# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

# PB-010：开发期 bundle id。最终签名身份（证书 / Team ID / 正式 appId）在 PB-114 确定。
appId: com.linguistagent.app
productName: Linguist Agent
artifactName: Linguist-Agent-${version}-${arch}.${ext}
copyright: Copyright © 2026 Linguist Agent contributors; portions Copyright © 2024-2026 Erlich Liu

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 43.2.0

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# ASAR 打包配置
# 启用 ASAR 归档，将 Pi native addon 与其它 native binary 解压到 app.asar.unpacked/ 避免路径问题
asar: true
asarUnpack:
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/@earendil-works/pi-tui/native/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/**"
  # node-pty 的 platform-native .node 与 ConPTY helper 不能留在 asar 内。
  - "node_modules/node-pty/**"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # Pi runtime 作为主进程 external 运行。打包前 sync:runtime-deps 会
  # 将 external 依赖闭包同步到 apps/electron/node_modules。
  - node_modules/**/*
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@proma/**"
  # 排除明确只在开发/构建期使用的大体积包。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"
  # 排除 Pi SDK 纯演示/文档/sourcemap 内容，保留运行时必需文件。
  - "!node_modules/@earendil-works/*/examples/**"
  - "!node_modules/@earendil-works/*/docs/**"
  - "!node_modules/@earendil-works/**/*.map"

# 通用额外资源
extraResources:
  # proma CLI 自包含二进制（build:cli 用 bun build --compile 产出到 resources/bin/）。
  # 运行时由主进程注入 PROMA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # OfficeCLI Excel 高保真渲染器；由 prepare:officecli 下载、固定版本并校验 SHA-256。
  - from: resources/officecli
    to: officecli
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.linguist-agent/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # Linguist 常驻项目 Skill（PB-040）：只进 Resources，不同步到 ~/.linguist-agent；
  # 主进程仅对项目绑定会话经 additionalSkillPaths 注入，普通会话不注入。
  - from: ../../resources/linguist-roles
    to: linguist-roles
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: ../../tutorial/tutorial-v2.md
    to: tutorial.md
  # Proma 品牌 Logo 素材（品牌素材下载功能使用）
  - from: resources/proma-logos
    to: proma-logos
    filter:
      - "**/*"
  # 默认 Dock 图标（macOS app.dock.setIcon 使用）
  - from: resources/icon.png
    to: icon.png
  # 发行物内的许可、归属与机器可读 SBOM；packaged verifier 会逐项校验 hash。
  - from: ../../LICENSE
    to: legal/LICENSE
  - from: ../../NOTICE.md
    to: legal/NOTICE.md
  - from: ../../ATTRIBUTION.md
    to: legal/ATTRIBUTION.md
  - from: ../../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: ../../docs/release/SBOM.md
    to: legal/SBOM.md
  - from: ../../docs/release/sbom-full.json
    to: legal/sbom-full.json
  # Renderer bundle 载入前显示的静态启动页，避免运行时检测期间出现空白窗口。
  - from: resources/startup-splash
    to: startup-splash
    filter:
      - "**/*"

# ============================================
# macOS 配置
# ============================================
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # Swift/AppKit 原生灵动岛宿主；须显式标记为需签名的额外二进制。
  extraResources:
    - from: resources/agent-island/macos-agent-island-helper
      to: agent-island/macos-agent-island-helper
    # EventKit N-API bridge 在 Electron main 进程内执行，确保 TCC 归属 Proma.app。
    - from: resources/eventkit/macos-eventkit.node
      to: eventkit/macos-eventkit.node
  binaries:
    - resources/agent-island/macos-agent-island-helper
    - resources/eventkit/macos-eventkit.node
    - resources/officecli/officecli
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Linguist Agent 需要访问麦克风，用于将你的语音实时转写为文本。"
    NSCalendarsFullAccessUsageDescription: "Linguist Agent 需要访问你的日历，以显示、创建和同步你选择的日程。"
    NSRemindersFullAccessUsageDescription: "Linguist Agent 需要访问你的提醒事项，以同步 Todo 和你选择的列表。"
  # 架构由 CLI 参数控制（CI 矩阵分别传 --arm64 / --x64），
  # 每个 runner 只构建其宿主架构对应的产物。
  target:
    - dmg
    - zip

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 330
      type: file
      path: resources/macos-install-help.txt
      name: 首次打开说明.txt
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: false

# ============================================
# 发布配置
# 每个平台的 build job 通过 --publish always 直接上传到 GitHub Release。
# electron-builder 会自动创建/复用 Release，并在多架构并行上传时合并 latest-mac.yml。
# ============================================
publish:
  provider: github
  owner: wangyu-sg
  repo: linguist-agent-public
