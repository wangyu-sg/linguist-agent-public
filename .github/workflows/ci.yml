name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: TypeScript 类型检查
        run: bun run typecheck

      - name: 关键生产链与边界回归
        run: bun run test

      - name: Proma 同步合同
        run: |
          node scripts/verify-host-seams.mjs
          node scripts/test-proma-sync-replay.mjs

      - name: 依赖许可扫描
        run: bun run license:check

      - name: Electron 构建
        run: bun run electron:build

  package-verify:
    name: package-verify (macOS arm64)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: CAT 编辑器真实浏览器回归
        run: bun test apps/electron/src/renderer/features/linguist/projects/cat-editor.browser.test.ts

      - name: 打包与垂直链路验证
        working-directory: apps/electron
        run: |
          rm -rf out/smoke/vertical
          bun run smoke:vertical
          jq -e --arg head "$(git rev-parse HEAD)" '
            .sourceHead == $head and
            .runStatus == "passed" and
            ([.steps[].id] == ["package", "workspace-deps", "agent", "chat", "project-switch", "linguist-current"]) and
            all(.steps[]; .status == "passed" and .exitCode == 0)
          ' out/smoke/vertical/vertical-smoke-report.json

      - name: 语言资产 Dock 专项回归
        working-directory: apps/electron
        run: node scripts/smoke/probe-pb074-e2e.ts --lf056-only > out/smoke/vertical/linguist-dock.log 2>&1

      - name: 保存打包与垂直链路证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-vertical-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/electron/out/smoke/vertical/
          if-no-files-found: error
