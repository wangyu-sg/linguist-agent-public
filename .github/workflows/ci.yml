name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run roadmap:validate
      - run: npm run architecture:check
      - run: npm run test:roadmap
      - name: Record discovered root tests
        run: npm run test:list > "$RUNNER_TEMP/la-test-discovery.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-test-discovery
          path: ${{ runner.temp }}/la-test-discovery.txt
          if-no-files-found: error

  unit:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install test system dependencies
        run: |
          brew install poppler
          python3 -m venv "$RUNNER_TEMP/la-python"
          "$RUNNER_TEMP/la-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/la-python/bin/python" -m pip install openpyxl
          echo "$RUNNER_TEMP/la-python/bin" >> "$GITHUB_PATH"
          echo "LA_WORKBOOK_PYTHON=$RUNNER_TEMP/la-python/bin/python3" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  security:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:security

  recovery:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:recovery

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run mac:build
      - run: npm run mac:test

  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run release:check

  legacy-verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install test system dependencies
        run: |
          brew install poppler
          python3 -m venv "$RUNNER_TEMP/la-python"
          "$RUNNER_TEMP/la-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/la-python/bin/python" -m pip install openpyxl
          echo "$RUNNER_TEMP/la-python/bin" >> "$GITHUB_PATH"
          echo "LA_WORKBOOK_PYTHON=$RUNNER_TEMP/la-python/bin/python3" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test
      - name: Run Electron macOS client tests
        run: npm run mac:test
