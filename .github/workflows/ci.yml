name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: TypeScript 类型检查
        run: bun run typecheck

      - name: 关键回归（目标 200–300 条）
        run: bun run test

      - name: Proma 同步合同
        run: |
          node scripts/audit-proma-drift.mjs > "$RUNNER_TEMP/proma-drift.json"
          node scripts/verify-host-seams.mjs
          node scripts/test-proma-sync-replay.mjs

      - name: 依赖许可扫描
        run: bun run license:check

      - name: Electron 构建
        run: bun run electron:build

  package-verify:
    name: package-verify (macOS arm64)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建并同步运行时依赖
        run: |
          bun --cwd apps/electron run build
          bun --cwd apps/electron run sync:runtime-deps

      - name: 打包与垂直链路验证
        run: |
          bun --cwd apps/electron run smoke:pack
          bun --cwd apps/electron run smoke:vertical
