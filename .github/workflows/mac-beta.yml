name: macOS Beta Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to publish as beta
        required: false
        default: main

concurrency:
  group: mac-beta-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  beta:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      LA_BUILD_NUMBER: ${{ github.run_number }}
      LA_DEVELOPER_ID_APPLICATION: ${{ vars.LA_DEVELOPER_ID_APPLICATION }}
      LA_NOTARY_KEYCHAIN_PROFILE: la-notary-ci
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Export checked-out SHA
        run: echo "LA_RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import signing and notarization credentials
        env:
          CERT_P12_BASE64: ${{ secrets.LA_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.LA_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.LA_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.LA_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.LA_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/la-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials "$LA_NOTARY_KEYCHAIN_PROFILE" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
          echo "LA_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build and publish signed beta release
        run: npm run release:mac:publish -- --channel beta
