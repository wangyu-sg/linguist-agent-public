name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      run_validation:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_REF: ${{ inputs.ref || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: 完整 CI 门禁
    if: ${{ github.event_name != 'workflow_call' || inputs.run_validation }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  build-mac-arm64:
    name: build (macOS arm64)
    needs: validate
    if: ${{ always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出发布版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 校验版本
        run: test "$RELEASE_TAG" = "v$(node -p "require('./apps/electron/package.json').version")"

      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: 构建并发布 macOS arm64 草稿资产
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bun run build
          bun run sync:runtime-deps
          bunx electron-builder --mac --arm64 --publish always

  build-mac-x64:
    name: build (macOS x64)
    needs: validate
    if: ${{ always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: 检出发布版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 校验版本
        run: test "$RELEASE_TAG" = "v$(node -p "require('./apps/electron/package.json').version")"

      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: 构建并发布 macOS x64 草稿资产
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bun run build
          bun run sync:runtime-deps
          bunx electron-builder --mac --x64 --publish always

  build-windows-x64:
    name: build (Windows x64)
    needs: validate
    if: ${{ always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出发布版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 校验版本
        shell: bash
        run: test "$RELEASE_TAG" = "v$(node -p "require('./apps/electron/package.json').version")"

      - name: 构建并发布 Windows x64 草稿资产
        working-directory: apps/electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run build
          bun run sync:runtime-deps
          bunx electron-builder --win --x64 --publish always

  merge-mac-yml:
    name: 合并 macOS 更新元数据
    needs: [build-mac-arm64, build-mac-x64]
    runs-on: ubuntu-latest
    steps:
      - name: 合并并上传 latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir mac-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-mac.zip' --dir mac-assets
          ARM64_ZIP="$(find mac-assets -type f -name '*arm64-mac.zip' -print -quit)"
          X64_ZIP="$(find mac-assets -type f -name '*-mac.zip' ! -name '*arm64*' -print -quit)"
          test -n "$ARM64_ZIP"
          test -n "$X64_ZIP"
          ARM64_SHA="$(openssl dgst -sha512 -binary "$ARM64_ZIP" | base64 -w0)"
          X64_SHA="$(openssl dgst -sha512 -binary "$X64_ZIP" | base64 -w0)"
          ARM64_SIZE="$(stat --format=%s "$ARM64_ZIP")"
          X64_SIZE="$(stat --format=%s "$X64_ZIP")"
          ARM64_NAME="$(basename "$ARM64_ZIP")"
          X64_NAME="$(basename "$X64_ZIP")"
          VERSION="${RELEASE_TAG#v}"
          RELEASE_DATE="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          printf '%s\n' \
            "version: ${VERSION}" \
            'files:' \
            "  - url: ${ARM64_NAME}" \
            "    sha512: ${ARM64_SHA}" \
            "    size: ${ARM64_SIZE}" \
            "  - url: ${X64_NAME}" \
            "    sha512: ${X64_SHA}" \
            "    size: ${X64_SIZE}" \
            "path: ${ARM64_NAME}" \
            "sha512: ${ARM64_SHA}" \
            "releaseDate: '${RELEASE_DATE}'" > latest-mac.yml
          gh release upload "$RELEASE_TAG" latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: 公开完整 Release
    needs: [build-mac-arm64, build-mac-x64, build-windows-x64, merge-mac-yml]
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: 检查资产并生成说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fx 'latest-mac.yml'
          printf '%s\n' "$ASSETS" | grep -Fx 'latest.yml'
          printf '%s\n' "$ASSETS" | grep -E 'arm64-mac\.zip$'
          printf '%s\n' "$ASSETS" | grep -E -- '-mac\.zip$' | grep -v arm64
          printf '%s\n' "$ASSETS" | grep -E 'arm64\.dmg$'
          printf '%s\n' "$ASSETS" | grep -E '\.dmg$' | grep -v arm64
          printf '%s\n' "$ASSETS" | grep -E '\.exe$'
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -1 || true)"
          node scripts/generate-release-notes.mjs --from "$PREVIOUS_TAG" --to "$RELEASE_REF" --tag "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Linguist Agent ${RELEASE_TAG#v}" --notes-file release-notes.md --draft=false --latest
