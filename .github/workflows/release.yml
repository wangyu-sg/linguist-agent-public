name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布的 Git ref
        required: true
        type: string
      tag:
        description: Release Tag（例如 v0.17.31）
        required: true
        type: string
      run_validation:
        description: 是否重新运行完整 CI
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      run_validation:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  RELEASE_REF: ${{ inputs.ref || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: 完整 CI 门禁
    if: ${{ github.event_name == 'push' || inputs.run_validation }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  build-mac-arm64:
    name: build (macOS arm64)
    needs: validate
    if: ${{ always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出发布版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 校验版本
        run: test "$RELEASE_TAG" = "v$(node -p "require('./apps/electron/package.json').version")"

      - name: 准备 OfficeCLI（macOS arm64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAC_CERTS"
          test -n "$MAC_CERTS_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security find-certificate -c 'Linguist Agent Self Update' -p "$KEYCHAIN_PATH" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F '"Linguist Agent Self Update"'
          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      - name: 构建并发布 macOS arm64 草稿资产
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_NAME: Linguist Agent Self Update
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bun run build
          bun run rebuild:node-pty
          bun run sync:runtime-deps
          bun run ensure:node-pty-helper
          bun run scripts/run-electron-builder.ts --mac --arm64 --publish always

  publish-release:
    name: 公开 macOS arm64 Release
    needs: build-mac-arm64
    if: ${{ always() && needs.build-mac-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: 检查资产并生成说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".blockmap"))' \
            | while IFS= read -r ASSET; do
                gh release delete-asset "$RELEASE_TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes
              done
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fx 'latest-mac.yml'
          printf '%s\n' "$ASSETS" | grep -E -- '-arm64\.zip$'
          printf '%s\n' "$ASSETS" | grep -E -- '-arm64\.dmg$'
          node scripts/generate-release-notes.mjs --tag "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Linguist Agent ${RELEASE_TAG#v}" --notes-file release-notes.md --draft=false --latest
