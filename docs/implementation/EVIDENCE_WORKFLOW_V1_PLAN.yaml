schemaVersion: 1
initiative: Evidence Workflow V1
branch: feature/evidence-workflow-v1
baseCommit: 649134cc
status: completed
currentBatch: null
mergePolicy: all_batches_and_final_gate_only
releasePolicy: no_intermediate_release

architecture:
  taskEntity: forbidden
  duplicateEvidenceCatalog: forbidden
  genericEvidenceGraph: forbidden
  secondDeliveryAttestation: forbidden
  reusableFacts:
    - Session
    - LinguistRole
    - StageRun
    - Asset
    - FrozenSegmentScope
    - ContextDoc
    - StageCoverage
    - DeliveryPreflight
    - ExportManifest
  newFacts:
    - ProjectDiscoveryScope
    - StageEvidenceBaseline
    - EvidenceGap
    - StageEvidenceReceipt
    - ContextAnchor

batches:
  - id: 1
    name: 领域模型和授权范围
    status: completed
    commit: be52715e
    acceptance:
      - 不新增通用 Task 实体
      - Evidence Baseline 不冻结可正常变化的 Segment Revision
      - ProjectDiscoveryScope 仅由宿主从受信 Workspace 与附件生成
      - 明确 Gap、Receipt、Context Anchor 与 Stage Evidence 状态合同
    verification:
      - bun test stage-evidence.test.ts project-discovery-scope.test.ts: passed 2/2
      - bun run --filter='@linguist/cat-store' test: passed 50/50
      - cat-core cat-store electron typecheck: passed
      - bun install --frozen-lockfile: no changes

  - id: 2
    name: 自动资产预检
    status: completed
    commit: ddf83e7f
    acceptance:
      - 复用现有递归扫描和 dryRun
      - 导入或解析失败形成持久 Gap
      - 返回发现、解析、未映射、媒体与版本冲突摘要
      - 简单单文件项目自动 Ready 且不询问
    verification:
      - project inventory and discovery pure tests: passed 3/3
      - cat-store test: passed 51/51
      - cat-tools test: passed 43/43
      - cat-core cat-store cat-tools electron typecheck: passed
      - bun install --frozen-lockfile: no changes

  - id: 3
    name: 通用 Context Extraction
    status: completed
    commit: bf164714
    acceptance:
      - Context XLSX 不要求双语 Batch mapping
      - XLSX 支持嵌入图片、drawing anchor 与 Sheet/Row/Cell 定位
      - ContextExtraction 合同覆盖文字、媒体、锚点与警告
      - Asset、Segment 与 Context anchor 使用类型化链接
      - 匿名异构伴生资料 Fixture 通过
    verification:
      - anonymous 79-row / 64-image XLSX extraction fixture: passed
      - DOCX PDF standalone image and unsupported-format extraction tests: passed 3/3
      - explicit Context XLSX without bilingual mapping test: passed
      - cat-store migration and Context evidence tests: passed 52/52
      - cat-tools context read tests: passed 43/43
      - cat-core cat-formats cat-store cat-tools electron typecheck: passed
      - bun install --frozen-lockfile: passed

  - id: 4
    name: Stage Evidence Plan 与自动调用
    status: completed
    commit: 3f50742a
    acceptance:
      - Stage 开始时生成 required、conditional、optional 与 open gaps
      - translation context 自动提供小型强关联证据和 required pending
      - Context 内容进入模型请求时由宿主记录 Receipt
      - 父子 Session 共享同一 Evidence Baseline
    verification:
      - delegated parent/child Stage baseline host test: passed 1/1
      - unmapped worksheet content remains a persistent non-blocking PM confirmation warning: passed
      - presented Context text/image receipt test: passed
      - cat-tools test: passed 44/44
      - cat-store test: passed 52/52
      - prompt and session IPC tests: passed 4/4
      - cat-core cat-formats cat-store cat-tools electron typecheck: passed

  - id: 5
    name: 完成门禁与导出
    status: completed
    commit: 8f2f562f
    acceptance:
      - 仅显式 blocking Gap 或 required presentation coverage 缺失时不能 Full Review Complete
      - 未映射内容默认仅提醒向 PM 确认，不阻断审校、确认或交付
      - 现有 Verified Preflight 同时检查 Stage 与 Evidence Coverage
      - 现有 Export Manifest 记录覆盖摘要
      - as-is 保留并明确列出缺口
      - 不建立第二套 Delivery Attestation
    verification:
      - dual decision/Evidence Full Review gate in cat_confirm_segments: passed
      - warning-only PM confirmation remains deliverable; blocking Gap stops completion: passed
      - delivery evidence summary and verified/as-is manifest test: passed 2/2
      - cat-tools test: passed 44/44
      - cat-store test: passed 52/52
      - root typecheck and upstream boundary check: passed
      - Linguist fusion architecture test: passed 10/10

  - id: 6
    name: UI、回归与真实验证
    status: completed
    commit: 94f36644
    acceptance:
      - 提供紧凑的资产与证据覆盖面板
      - 系统签发状态与 Agent 自然语言分开显示
      - 简单单文件与至少两种异构资料组合回归通过
      - Translator、Reviewer、Proofreader 共享证据闭环
      - packaged smoke 与 export/reimport 通过
    verification:
      - compact system-signed evidence coverage panel and delegation evidence summary: implemented
      - Translator → Reviewer → Proofreader host Evidence loop: passed 1/1
      - root typecheck: passed
      - packaged artifact build and integrity verification: passed
      - Agent packaged vertical: passed 15/15
      - Chat packaged vertical: passed 19/19
      - Linguist packaged vertical and export/reimport: passed 21/21
      - native Open/Save dialogs remain explicitly manual and are not reported as automated

finalGate:
  status: completed
  acceptance:
    - 单文件简单项目无额外摩擦
    - 复杂项目自动发现伴生资料且未知资料不静默忽略
    - 导入失败形成持久 Gap
    - Segment 可获取关联文字和图片
    - 必需资料进入模型请求后才产生 Receipt
    - 正常 Target 修改不令 Evidence Baseline stale
    - 参考资料或授权范围变化会令当前 Stage stale
    - Full Review 受 Stage 与 Evidence 双 Coverage 控制
    - Verified 与 as-is Manifest 准确反映覆盖和缺口
    - Agent 文本不能冒充系统 Verified 状态
    - 匿名异构 Fixture、全量测试、typecheck、build 与 smoke 通过
  verification:
    - simple single-asset Stage auto-presents its managed source evidence without extra prompts
    - heterogeneous XLSX DOCX PDF image and unsupported-format fixtures produce extracted evidence or explicit gaps
    - warning-only unmapped rows/media persist a PM-confirmation reminder without blocking review or delivery
    - required Evidence Receipt, stale-baseline, dual-coverage and verified/as-is tests passed
    - anonymous heterogeneous fixture contains no HOK names, fixed workbook names, fixed columns or customer-count branches
    - full repository tests, typecheck, upstream boundaries and fusion architecture passed
    - packaged vertical runStatus passed; automated contract coverage remains partial only for native Open/Save dialogs
